[project]
name = "gamemaster"
version = "0.1.0"
description = "Game-agnostic agent + fine-tuning pipeline for novel games (AMD AI Academy mini-challenge 6)"
requires-python = ">=3.11"
dependencies = ["academy-core", "httpx>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
train = ["torch", "transformers>=4.46", "trl>=0.14", "peft>=0.13", "datasets>=3.0", "accelerate>=1.0"]

[project.scripts]
gamemaster = "gamemaster.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamemaster"]

[tool.uv.workspace]
members = ["academy-core"]

[tool.uv.sources]
academy-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "academy-core/tests"]
markers = ["network: test hits the live internet (deselect with -m 'not network')"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B027"]

[tool.ruff.lint.isort]
known-first-party = ["academy_core", "gamemaster"]
